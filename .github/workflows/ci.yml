# Continuous integration: starts the real MariaDB 13.1 server (the same Docker
# image and docker-compose.yml as on a developer machine, including TLS and
# ED25519), runs the whole pytest suite against it (including the Interactive Lab's
# API) and then the full demo. The lab's frontend is type-checked, unit-tested and built.
#
# Everything is covered on GitHub-hosted runners: Docker is preinstalled, and the
# MariaDB Foundation's 13.1 image is public on quay.io. Nothing is mocked.
#
# Two jobs:
#   test    the default image of docker-compose.yml: the pinned digest of the exact
#           build this project was verified with. A failure here blocks the build.
#   canary  floating 13.1 tag. MariaDB 13.1 is a preview release; this job shows
#           early if a newer build changes DENY/auth/TLS behaviour. It is allowed
#           to fail without turning the whole workflow red.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC, to run the canary

permissions:
  contents: read

env:
  FLOATING_IMAGE: quay.io/mariadb-foundation/mariadb-devel:13.1

jobs:
  test:
    name: Tests on MariaDB 13.1 (pinned image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: make venv

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint (ruff + shellcheck)
        run: make lint

      - name: Frontend - type check, unit tests, production build
        run: make frontend-test frontend

      - name: Start MariaDB 13.1 (fresh certificates, TLS on, no passwords)
        run: make up

      - name: Show the server version
        run: docker compose exec -T mariadb mariadbd --version

      - name: Run the test suite
        run: make test

      - name: Run the full demonstration
        run: make demo 2>&1 | tee demo-output.txt

      - name: Experiment 14 - PUBLIC hard lockout on a disposable server
        run: make lockout

      - name: Keep the demo output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: demo-output.txt
          if-no-files-found: ignore

      - name: Server log (on failure)
        if: failure()
        run: docker compose logs --no-color mariadb

  canary:
    name: Canary on the floating 13.1 tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Start MariaDB 13.1 (latest build of the tag)
        run: make up
        env:
          MARIADB_IMAGE: ${{ env.FLOATING_IMAGE }}

      - name: Install Python dependencies
        run: make venv

      - name: Run the test suite
        run: make test
        env:
          MARIADB_IMAGE: ${{ env.FLOATING_IMAGE }}

      - name: Server log (on failure)
        if: failure()
        run: docker compose logs --no-color mariadb
        env:
          MARIADB_IMAGE: ${{ env.FLOATING_IMAGE }}
