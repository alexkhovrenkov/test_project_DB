# Starts one MariaDB 13.1 server in a Docker container.
#
#   make setup / make demo        (recommended: does everything below for you)
#   docker compose up -d --wait   start it (and wait until it is healthy)
#   docker compose down -v        stop it AND delete the data (full reset)
#
# Optional, non-secret settings (port, container name, image) can be put in .env.

services:
  mariadb:
    # MariaDB 13.1 is needed because it is the first version with DENY.
    # By default: the exact 13.1.2 build every result in the README was produced
    # with (pinned by digest, so a newer preview build cannot change behaviour
    # under you). To try the newest 13.1 preview build, set in .env:
    #   MARIADB_IMAGE=quay.io/mariadb-foundation/mariadb-devel:13.1
    image: ${MARIADB_IMAGE:-quay.io/mariadb-foundation/mariadb-devel@sha256:ed1087249cadb93623dd3b11258ea9790ad8f49c328dae5a5ef726ff1cea2931}
    container_name: ${MARIADB_CONTAINER:-university-db}

    # No password is configured anywhere. The entrypoint creates root@localhost
    # with an empty password, reachable only through the socket of the
    # temporary init server (which runs with --skip-networking); no root@'%'
    # account is created. The last init script (sql/05_lockdown.sh) switches
    # root to unix_socket authentication, so after init root has no password
    # at all and can only be used via "docker exec" (make shell).
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_ROOT_HOST: localhost

    # Only reachable from this computer (127.0.0.1), never from the network.
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"

    # The image runs every file in /docker-entrypoint-initdb.d (in alphabetical
    # order) the FIRST time the database is created. That is how our schema,
    # data, roles and users get loaded automatically.
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      # Certificates created by scripts/generate_certs.sh. Mounted read-only
      # at a staging path; the entrypoint below copies them into place.
      - ./certs:/certs-src:ro

    # MariaDB runs as the unprivileged user "mysql" (uid 999), but the key on
    # the host is only readable by YOU (mode 600). So, while still root inside
    # the container, copy the key to a container-private directory, owned by
    # mysql with mode 600, and only then hand over to the normal entrypoint.
    # Result: the private key is never world-readable, on the host or inside.
    entrypoint:
      - bash
      - -ec
      - |
        install -d -m 0755 /etc/mysql/tls
        install -m 0644 -o mysql -g mysql /certs-src/ca.pem /certs-src/server-cert.pem /etc/mysql/tls/
        install -m 0600 -o mysql -g mysql /certs-src/server-key.pem /etc/mysql/tls/server-key.pem
        exec docker-entrypoint.sh "$$@"
      - entrypoint

    # Extra server options = TLS configuration.
    command:
      - --ssl-cert=/etc/mysql/tls/server-cert.pem   # the server's certificate
      - --ssl-key=/etc/mysql/tls/server-key.pem     # its private key
      - --ssl-ca=/etc/mysql/tls/ca.pem              # the CA that signed it
      - --tls-version=TLSv1.2,TLSv1.3               # no legacy protocol versions
      # Refuse every network connection that does not use TLS.
      # (Connections through the local Unix socket inside the container are
      #  still allowed; that is how "docker exec ... mariadb" works.)
      - --require-secure-transport=ON
      # Password policy plugins (installed by sql/05_password_policy.sql). "loose-"
      # lets the very first start, before the plugins exist, ignore these options.
      - --loose-simple-password-check-minimal-length=12
      - --loose-password-reuse-check-interval=365       # days a password counts as "used"

    # Lets "docker compose up --wait" know when the server is ready.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
